<!doctype html>
<!-- Source for public/og-image.png (1200x630). Render with: npm run og (from scripts/brand). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url("../../src/assets/fonts/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../src/assets/fonts/geist-mono-latin.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f3ed;
        font-family: Geist;
        color: #10141b;
        font-feature-settings: "ss01" 1;
        position: relative;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .brand svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 188px;
        font-size: 92px;
        line-height: 0.98;
        font-weight: 560;
        letter-spacing: -0.04em;
      }
      h1 i {
        font-style: normal;
        color: #1494f2;
      }
      .sub {
        position: absolute;
        left: 74px;
        bottom: 70px;
        font-size: 25px;
        color: #56606e;
        letter-spacing: -0.01em;
      }
      .sub b {
        color: #10141b;
        font-weight: 500;
      }
      .win {
        position: absolute;
        left: 680px;
        top: 128px;
        width: 480px;
        height: 560px;
        border-radius: 16px;
        background: #0f1115;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 30px 60px -28px rgba(14, 21, 34, 0.45);
        overflow: hidden;
        color: #e8ebf0;
      }
      .bar {
        height: 38px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid #232a35;
        background: #0b0d10;
      }
      .bar span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .head {
        padding: 22px 22px 12px;
        font-size: 20px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 54px;
        padding: 0 22px;
        border-top: 1px solid #232a35;
        font-size: 17px;
      }
      .row .n {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
      }
      .row .n.c {
        padding-left: 20px;
        color: #e8ebf0;
      }
      .row .img {
        font-family: "Geist Mono";
        font-size: 13px;
        color: #9aa3b2;
        width: 146px;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        gap: 7px;
        font-size: 14px;
        padding: 3px 10px;
        border-radius: 99px;
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.25);
      }
      .badge:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.x {
        background: rgba(255, 255, 255, 0.04);
        color: #9aa3b2;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="brand"><!-- MARK -->nookat</div>
    <h1>Containers,<br />minus the<br />weight<i>.</i></h1>
    <p class="sub"><b>Free and open source</b> · macOS, Windows, Linux</p>
    <div class="win">
      <div class="bar">
        <span style="background: #ff5f57"></span
        ><span style="background: #febc2e"></span
        ><span style="background: #28c840"></span>
      </div>
      <div class="head">Containers</div>
      <div class="row">
        <span class="n" style="font-weight: 600">storefront</span
        ><span class="badge">running</span>
      </div>
      <div class="row">
        <span class="n c">storefront-web-1</span
        ><span class="img">nginx:1.27-alpine</span
        ><span class="badge">running</span>
      </div>
      <div class="row">
        <span class="n c">storefront-api-1</span
        ><span class="img">node:22-alpine</span
        ><span class="badge">running</span>
      </div>
      <div class="row">
        <span class="n c">storefront-db-1</span
        ><span class="img">postgres:16-alpine</span
        ><span class="badge">running</span>
      </div>
      <div class="row">
        <span class="n">redis-cache</span><span class="img">redis:7-alpine</span
        ><span class="badge">running</span>
      </div>
      <div class="row">
        <span class="n">mailpit</span><span class="img">axllent/mailpit</span
        ><span class="badge x">exited</span>
      </div>
    </div>
  </body>
</html>
