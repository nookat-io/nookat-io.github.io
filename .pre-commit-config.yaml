repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json

  # These run the versions pinned in package.json, so hooks and `npm run check` agree.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^(public/brand/|public/favicon\.svg$)

      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings=0 --no-warn-ignored
        language: system
        files: \.(js|mjs|ts|tsx)$

      - id: typescript-check
        name: TypeScript Check
        entry: npx tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
